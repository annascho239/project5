<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Inner Orbit Phase 2 browser test</title>
    <style>
      body { font: 16px system-ui; margin: 1rem; }
      iframe { width: 390px; height: 844px; border: 1px solid #888; }
      [data-status="PASS"] { color: green; }
      [data-status="FAIL"] { color: darkred; }
    </style>
  </head>
  <body>
    <h1>Phase 2 browser test</h1>
    <p id="result" data-status="RUNNING">RUNNING</p>
    <ol id="details"></ol>
    <iframe id="app" src="../index.html" title="Inner Orbit under test"></iframe>

    <script>
      "use strict";

      const frame = document.querySelector("#app");
      const result = document.querySelector("#result");
      const details = document.querySelector("#details");

      function record(name, passed, actual = "") {
        const item = document.createElement("li");
        item.textContent = `${passed ? "PASS" : "FAIL"}: ${name}${actual ? ` (${actual})` : ""}`;
        details.append(item);
        return passed;
      }

      function change(control, value, eventName = "input") {
        control.value = value;
        control.dispatchEvent(new Event(eventName, { bubbles: true }));
      }

      function waitFor(predicate, timeout = 4000) {
        return new Promise((resolve, reject) => {
          const startedAt = performance.now();
          const check = () => {
            if (predicate()) {
              resolve();
            } else if (performance.now() - startedAt > timeout) {
              reject(new Error("Timed out waiting for browser result."));
            } else {
              setTimeout(check, 20);
            }
          };
          check();
        });
      }

      frame.addEventListener("load", async () => {
        const app = frame.contentDocument;
        const checks = [];
        const addButton = app.querySelector("#add-star");

        try {

        checks.push(record("starts with one star", app.querySelectorAll(".star-fieldset").length === 1));
        checks.push(record("final star cannot be removed", app.querySelector(".remove-star").disabled));

        for (let count = 1; count < 5; count += 1) addButton.click();
        checks.push(record("adds up to five stars", app.querySelectorAll(".star-fieldset").length === 5));
        checks.push(record("sixth star is prevented", addButton.disabled));

        const labels = [...app.querySelectorAll('.star-fieldset input[type="text"]')];
        labels.forEach((input, index) => change(input, `Meaning ${index + 1}`));

        const categories = [...app.querySelectorAll(".star-fieldset select")];
        change(categories[1], "place", "change");
        change(categories[2], "memory", "change");

        const canvas = app.querySelector("#preview-canvas");
        const calmPixel = [...canvas.getContext("2d").getImageData(2, 2, 1, 1).data].join(",");
        checks.push(record("preview canvas has a drawing buffer", canvas.width > 0 && canvas.height > 0));
        checks.push(record(
          "preview keeps the wallpaper aspect ratio",
          Math.abs(canvas.width / canvas.height - 1179 / 2556) < 0.01,
          `${canvas.width} × ${canvas.height}`,
        ));

        const energized = app.querySelector('input[name="mood"][value="energized"]');
        energized.checked = true;
        energized.dispatchEvent(new Event("change", { bubbles: true }));
        const energizedPixel = [...canvas.getContext("2d").getImageData(2, 2, 1, 1).data].join(",");
        checks.push(record("energized mood updates text summary", app.querySelector("#result-summary").textContent.includes("Energized")));
        checks.push(record("mood changes the canvas atmosphere", calmPixel !== energizedPixel));
        checks.push(record("mood preserves star labels", labels.every((input, index) => input.value === `Meaning ${index + 1}`)));
        checks.push(record("summary includes changed categories", app.querySelector("#result-summary").textContent.includes("place") && app.querySelector("#result-summary").textContent.includes("memory")));

        const downloads = [];
        const anchorPrototype = frame.contentWindow.HTMLAnchorElement.prototype;
        const originalAnchorClick = anchorPrototype.click;
        anchorPrototype.click = function captureDownload() {
          downloads.push({ href: this.href, download: this.download });
        };

        app.querySelector("#design-form").requestSubmit();
        await waitFor(() => downloads.length === 1 && !app.querySelector('button[type="submit"]').disabled);
        checks.push(record("valid form reaches export success", app.querySelector("#app-status").dataset.tone === "success"));
        checks.push(record("download has a clear filename", downloads[0].download === "inner-orbit-iphone-15-pro.png"));

        const pngBlob = await fetch(downloads[0].href).then((response) => response.blob());
        const pngBytes = await pngBlob.arrayBuffer();
        const pngView = new DataView(pngBytes);
        const pngSignature = [...new Uint8Array(pngBytes, 0, 8)].join(",");
        checks.push(record("export is a nonempty PNG", pngBlob.type === "image/png" && pngBlob.size > 10000 && pngSignature === "137,80,78,71,13,10,26,10", `${pngBlob.size} bytes`));
        checks.push(record("PNG width is 1179", pngView.getUint32(16) === 1179));
        checks.push(record("PNG height is 2556", pngView.getUint32(20) === 2556));

        for (let exportNumber = 1; exportNumber < 5; exportNumber += 1) {
          app.querySelector("#design-form").requestSubmit();
          await waitFor(() => downloads.length === exportNumber + 1 && !app.querySelector('button[type="submit"]').disabled);
        }
        checks.push(record("five consecutive exports succeed", downloads.length === 5));
        checks.push(record("temporary export canvases leave the document", app.querySelectorAll("canvas").length === 1));

        const canvasPrototype = frame.contentWindow.HTMLCanvasElement.prototype;
        const originalToBlob = canvasPrototype.toBlob;
        canvasPrototype.toBlob = function returnNull(callback) {
          setTimeout(() => callback(null), 0);
        };
        app.querySelector("#design-form").requestSubmit();
        await waitFor(() => app.querySelector("#app-status").dataset.tone === "error");
        checks.push(record("null PNG result shows an error", app.querySelector("#app-status").textContent.includes("couldn't create")));
        checks.push(record("failed export preserves labels", labels.every((input, index) => input.value === `Meaning ${index + 1}`)));
        canvasPrototype.toBlob = originalToBlob;

        change(labels[0], "");
        app.querySelector("#design-form").requestSubmit();
        checks.push(record("blank label blocks submit", app.querySelector("#app-status").dataset.tone === "error"));
        checks.push(record("invalid field is identified", labels[0].getAttribute("aria-invalid") === "true"));
        checks.push(record("focus moves to invalid field", app.activeElement === labels[0]));

        const removeButtons = [...app.querySelectorAll(".remove-star")];
        removeButtons.at(-1).click();
        checks.push(record("remove returns to four stars", app.querySelectorAll(".star-fieldset").length === 4));

        while (app.querySelectorAll(".star-fieldset").length > 1) {
          [...app.querySelectorAll(".remove-star")].at(-1).click();
        }
        const soloLabel = app.querySelector('.star-fieldset input[type="text"]');
        change(soloLabel, "Solo star");
        app.querySelector("#design-form").requestSubmit();
        await waitFor(() => downloads.length === 6 && !app.querySelector('button[type="submit"]').disabled);
        checks.push(record("one-star export succeeds", app.querySelector("#app-status").dataset.tone === "success"));
        checks.push(record("one-star state leaves one primary input", app.querySelectorAll(".star-fieldset").length === 1));
        anchorPrototype.click = originalAnchorClick;

        const viewport = frame.contentWindow;
        checks.push(record(
          "390px viewport has no horizontal overflow",
          app.documentElement.scrollWidth <= viewport.innerWidth,
          `${app.documentElement.scrollWidth}px / ${viewport.innerWidth}px`,
        ));

        const passed = checks.every(Boolean);
        result.dataset.status = passed ? "PASS" : "FAIL";
        result.textContent = passed ? "PASS" : "FAIL";
        } catch (error) {
          record("test runner completed", false, error.message);
          result.dataset.status = "FAIL";
          result.textContent = "FAIL";
        }
      });
    </script>
  </body>
</html>
