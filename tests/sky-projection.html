<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sky map projection checks</title>
  <style>
    body { margin: 1rem; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: #111; color: #eee; }
    li[data-pass="false"] { color: #ff8a8a; }
    li[data-pass="true"] { color: #8fe3b5; }
  </style>
</head>
<body>
  <h1 id="summary">Running…</h1>
  <ul id="checks"></ul>

  <script type="module">
    import { loadCatalog } from "../game-levels.js";
    import { horizontalPosition, visibleConstellations, constellationStars } from "../sky-engine.js";
    import { VIEW_LIMITS, arcPoints, clampView, directionVector, horizonVector, makeProjector, panView, pointSegmentDistance, starRadius, vectorToAzAlt, viewBasis, zoomView } from "../sky-projection.js";

    const checks = document.getElementById("checks");
    let allPassed = true;
    function record(label, passed, detail) {
      allPassed = allPassed && passed;
      const item = document.createElement("li");
      item.dataset.pass = String(passed);
      item.textContent = (passed ? "PASS — " : "FAIL — ") + label + (detail ? ": " + detail : "");
      checks.appendChild(item);
    }
    // A small repeatable random generator so the sampled cases are the same every run.
    let seed = 12345;
    const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const near = (a, b, tolerance) => Math.abs(a - b) <= tolerance;
    const angleGap = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

    try {
      const WIDTH = 393, HEIGHT = 560;
      const view = (azimuth, altitude, fov = 90) => ({ azimuth, altitude, fov });

      // ---- Agreement with the verified sky engine ----
      const observers = [{ latitude: 41.85, longitude: -87.65 }, { latitude: -33.87, longitude: 151.21 }, { latitude: 69.65, longitude: 18.96 }, { latitude: 0, longitude: 0 }];
      const dates = [new Date("2025-01-02T03:00:00Z"), new Date("2025-07-05T22:30:00Z"), new Date("1950-03-04T10:00:00Z")];
      let worst = 0, samples = 0;
      for (const observer of observers) for (const date of dates) for (let i = 0; i < 400; i += 1) {
        const ra = random() * 360 - 180, dec = Math.asin(random() * 2 - 1) * 180 / Math.PI;
        const engine = horizontalPosition(ra, dec, observer, date);
        const mine = vectorToAzAlt(horizonVector(ra, dec, observer, date));
        worst = Math.max(worst, Math.abs(engine.altitude - mine.altitude), engine.altitude > 89.9999 || engine.altitude < -89.9999 ? 0 : angleGap(engine.azimuth, mine.azimuth));
        samples += 1;
      }
      record("the map's horizon vectors give the same height and compass direction as the verified sky engine", worst < 1e-7, `${samples} random stars, worst difference ${worst.toExponential(1)}°`);

      const catalog = await loadCatalog("../vendor/d3-celestial/data/");
      const chicago = observers[0], chicagoJan = dates[0];
      const engineSky = Object.fromEntries(visibleConstellations(catalog.lines, chicago, chicagoJan).map((c) => [c.id, c.status]));
      let statusMismatch = 0;
      for (const [id, polylines] of catalog.lines) {
        const stars = constellationStars(polylines);
        const above = stars.filter(([ra, dec]) => horizonVector(ra, dec, chicago, chicagoJan)[2] > 0).length;
        const status = above === 0 ? "none" : above === stars.length ? "full" : "partial";
        if (status !== engineSky[id]) statusMismatch += 1;
      }
      record("classifying all 88 constellations from the map's own vectors gives the same full, partial, and none as the sky engine", statusMismatch === 0, `${statusMismatch} differences`);

      // ---- Orientation: the sky must not be mirrored ----
      const at = (v, az, alt) => makeProjector(v, WIDTH, HEIGHT).project(directionVector(az, alt));
      const southView = view(180, 30), centerX = WIDTH / 2, centerY = HEIGHT / 2;
      record("facing south, east is on your left and west on your right", at(southView, 150, 30).x > 0 && at(southView, 90, 30).x < centerX - 5 && at(southView, 270, 30).x > centerX + 5,
        `east at x=${at(southView, 90, 30).x.toFixed(0)}, west at x=${at(southView, 270, 30).x.toFixed(0)} (centre ${centerX})`);
      const northView = view(0, 30);
      record("facing north, east is on your right", at(northView, 90, 30).x > centerX + 5 && at(northView, 270, 30).x < centerX - 5);
      const eastView = view(90, 30);
      record("facing east, south is on your right and north on your left", at(eastView, 180, 30).x > centerX + 5 && at(eastView, 0, 30).x < centerX - 5);
      record("higher in the sky is higher on the screen", at(southView, 180, 50).y < centerY - 5 && at(southView, 180, 10).y > centerY + 5);
      const zenithProjector = makeProjector(view(123, 90), WIDTH, HEIGHT);
      const zen = zenithProjector.project(directionVector(0, 90));
      record("looking straight up keeps the zenith in the middle (no division trouble at the pole)", near(zen.x, centerX, 1e-6) && near(zen.y, centerY, 1e-6));
      const centred = makeProjector(view(217, 42, 70), WIDTH, HEIGHT).project(directionVector(217, 42));
      record("the direction you look in lands exactly in the middle of the screen", near(centred.x, centerX, 1e-6) && near(centred.y, centerY, 1e-6));

      // ---- Projection properties ----
      let roundTripWorst = 0, roundTripCount = 0;
      for (let i = 0; i < 2000; i += 1) {
        const v = view(random() * 360, random() * 95 - 5, 25 + random() * 115);
        const projector = makeProjector(v, 300 + random() * 600, 300 + random() * 600);
        const az = random() * 360, alt = random() * 180 - 90;
        const vec = directionVector(az, alt);
        const p = projector.project(vec);
        if (!p) continue;
        const back = projector.unproject(p.x, p.y);
        roundTripWorst = Math.max(roundTripWorst, Math.hypot(back[0] - vec[0], back[1] - vec[1], back[2] - vec[2]));
        roundTripCount += 1;
      }
      record("a point projected to the screen and mapped back is the same point on the sky", roundTripWorst < 1e-9, `${roundTripCount} cases, worst ${roundTripWorst.toExponential(1)}`);

      const probe = makeProjector(view(200, 35, 90), WIDTH, HEIGHT);
      const origin = probe.project(directionVector(200, 35));
      const right = probe.project(directionVector(200 + 0.1 / Math.cos(35 * Math.PI / 180), 35));
      const above = probe.project(directionVector(200, 35.1));
      const horizontalPixels = Math.hypot(right.x - origin.x, right.y - origin.y), verticalPixels = Math.hypot(above.x - origin.x, above.y - origin.y);
      record("one degree of sky is the same number of pixels in every direction, at the centre (shapes are not stretched)",
        near(horizontalPixels / verticalPixels, 1, 0.01) && near(horizontalPixels * 10, probe.pixelsPerUnit * Math.PI / 180, probe.pixelsPerUnit * 0.01 * Math.PI / 180 * 10),
        `${(horizontalPixels * 10).toFixed(3)} px per degree sideways, ${(verticalPixels * 10).toFixed(3)} up`);

      let fovFailures = 0;
      for (const [w, h] of [[393, 560], [800, 500], [400, 400]]) {
        for (const fov of [30, 60, 100, 139]) {
          const p = makeProjector(view(90, 0, fov), w, h);
          const edge = p.project(directionVector(90 + fov / 2, 0)); // fov/2 to the right of centre (same height)
          const expected = w / 2 + Math.min(w, h) / 2;
          if (!near(edge.x, expected, 0.01) || !near(edge.y, h / 2, 0.01)) fovFailures += 1;
        }
      }
      record("the field of view is measured across the shorter side of the screen", fovFailures === 0, `${fovFailures} failures over 12 sizes and zooms`);

      // Circles on the sky are circles on the screen (stereographic): the circle through three points contains the rest.
      const circleView = makeProjector(view(250, 20, 120), WIDTH, HEIGHT);
      const ring = [];
      const centreVec = directionVector(230, 40);
      const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const unit = (v) => { const n = Math.hypot(...v); return v.map((c) => c / n); };
      const perpA = unit(cross(centreVec, [0, 0, 1]));     // perpendicular to the centre direction
      const perpB = cross(centreVec, perpA);               // perpendicular to both
      for (let a = 0; a < 360; a += 15) {
        const r = 12 * Math.PI / 180, t = a * Math.PI / 180;
        const pt = [0, 1, 2].map((i) => Math.cos(r) * centreVec[i] + Math.sin(r) * (Math.cos(t) * perpA[i] + Math.sin(t) * perpB[i]));
        const p = circleView.project(pt);
        if (p) ring.push(p);
      }
      const [p1, p2, p3] = [ring[0], ring[8], ring[16]];
      const d = 2 * (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
      const ux = ((p1.x ** 2 + p1.y ** 2) * (p2.y - p3.y) + (p2.x ** 2 + p2.y ** 2) * (p3.y - p1.y) + (p3.x ** 2 + p3.y ** 2) * (p1.y - p2.y)) / d;
      const uy = ((p1.x ** 2 + p1.y ** 2) * (p3.x - p2.x) + (p2.x ** 2 + p2.y ** 2) * (p1.x - p3.x) + (p3.x ** 2 + p3.y ** 2) * (p2.x - p1.x)) / d;
      const radius = Math.hypot(p1.x - ux, p1.y - uy);
      const spread = Math.max(...ring.map((p) => Math.abs(Math.hypot(p.x - ux, p.y - uy) - radius)));
      record("a 12° circle on the sky is a true circle on the screen even at a 120° field of view", ring.length === 24 && spread < 1e-6, `${ring.length} points, worst deviation ${spread.toExponential(1)} px`);

      // ---- Looking around ----
      const base = view(100, 40, 90);
      const px = makeProjector(base, WIDTH, HEIGHT).pixelsPerUnit;
      const draggedRight = panView(base, 100, 0, px), draggedDown = panView(base, 0, 100, px);
      record("dragging right turns the view to smaller azimuth (the sky follows the finger); dragging down looks higher",
        draggedRight.azimuth < base.azimuth && draggedDown.altitude > base.altitude && draggedRight.altitude === base.altitude, `${draggedRight.azimuth.toFixed(2)}°, ${draggedDown.altitude.toFixed(2)}°`);
      const small = panView(base, 30, -20, px);
      const nowAt = makeProjector(small, WIDTH, HEIGHT).project(directionVector(base.azimuth, base.altitude));
      record("a small drag moves the sky about as far as the finger moved (grabbing the sky)", near(nowAt.x, WIDTH / 2 + 30, 3) && near(nowAt.y, HEIGHT / 2 - 20, 3), `the old centre is now at (${nowAt.x.toFixed(1)}, ${nowAt.y.toFixed(1)}), finger moved (+30, -20)`);
      record("azimuth wraps around the compass in both directions", panView(view(2, 30), 500, 0, px).azimuth > 180 && panView(view(358, 30), -500, 0, px).azimuth < 180 && clampView(view(-10, 30, 90)).azimuth === 350);
      record("you cannot look past straight up or far below the horizon", panView(base, 0, 1e6, px).altitude === VIEW_LIMITS.maxAltitude && panView(base, 0, -1e6, px).altitude === VIEW_LIMITS.minAltitude);
      const turn = (before, after) => angleGap(before.azimuth, after.azimuth);
      const lowTurn = turn(view(100, 5), panView(view(100, 5), 100, 0, px));
      const highTurn = turn(view(100, 85), panView(view(100, 85), 100, 0, px));
      const topTurn = turn(view(100, 90), panView(view(100, 90), 100, 0, px));
      record("near the zenith a sideways drag turns faster, but never more than 5 times as fast",
        highTurn > lowTurn && topTurn <= 5 * lowTurn * 1.01, `turns: ${lowTurn.toFixed(1)}° low, ${highTurn.toFixed(1)}° near the top, ${topTurn.toFixed(1)}° at the top`);
      record("zooming in narrows the field of view and stops at the limits", zoomView(base, 2).fov === 45 && zoomView(base, 100).fov === VIEW_LIMITS.minFov && zoomView(base, 0.01).fov === VIEW_LIMITS.maxFov);

      // ---- Lines and tapping ----
      const a = directionVector(10, 5), b = directionVector(130, 60);
      const arc = arcPoints(a, b);
      const angleAB = Math.acos(dot(a, b)) * 180 / Math.PI;
      const planeNormal = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const normLen = Math.hypot(...planeNormal);
      record("a line between far-apart stars follows the great circle between them in steps of at most 5°",
        arc.length === Math.ceil(angleAB / 5) + 1 && arc[0].every((v, i) => near(v, a[i], 1e-12)) && arc[arc.length - 1].every((v, i) => near(v, b[i], 1e-12)) &&
        arc.every((pt) => near(Math.hypot(...pt), 1, 1e-9) && near(dot(pt, planeNormal) / normLen, 0, 1e-9)) &&
        arc.every((pt, i) => i === 0 || Math.acos(Math.min(1, dot(pt, arc[i - 1]))) * 180 / Math.PI <= 5.0001), `${arc.length} points over ${angleAB.toFixed(1)}°`);
      record("distance from a tap to a line segment is right at the ends, the middle, and beyond",
        near(pointSegmentDistance(5, 3, 0, 0, 10, 0), 3, 1e-12) && near(pointSegmentDistance(-4, 3, 0, 0, 10, 0), 5, 1e-12) && near(pointSegmentDistance(13, 4, 0, 0, 10, 0), 5, 1e-12) && near(pointSegmentDistance(2, 2, 3, 3, 3, 3), Math.SQRT2, 1e-12));
      record("brighter stars are drawn bigger, within sensible limits, and a little bigger when zoomed in",
        starRadius(-1.4, 90) > starRadius(1, 90) && starRadius(1, 90) > starRadius(4, 90) && starRadius(6, 90) >= 0.6 && starRadius(-1.4, 90) <= 5.5 && starRadius(2, 30) > starRadius(2, 130));

      // ---- The compact star table against the full star file ----
      const table = await (await fetch("../data/stars-compact.json")).json();
      const full = (await (await fetch("../vendor/d3-celestial/data/stars.6.json")).json()).features;
      const byId = new Map(full.map((f) => [f.id, f]));
      let tableProblems = 0, worstPosition = 0, worstMagnitude = 0;
      for (const [hip, ra, dec, mag] of table.stars) {
        const f = byId.get(hip);
        if (!f) { tableProblems += 1; continue; }
        worstPosition = Math.max(worstPosition, Math.abs(f.geometry.coordinates[0] - ra), Math.abs(f.geometry.coordinates[1] - dec));
        worstMagnitude = Math.max(worstMagnitude, Math.abs(f.properties.mag - mag));
      }
      const sorted = table.stars.every((row, i) => i === 0 || row[0] > table.stars[i - 1][0]);
      record("the compact star table has every star of the full file, in order, with positions within 0.005° and magnitudes within 0.05",
        table.stars.length === full.length && tableProblems === 0 && sorted && worstPosition <= 0.0051 && worstMagnitude <= 0.0501,
        `${table.stars.length} stars; worst position ${worstPosition.toFixed(4)}°, worst magnitude ${worstMagnitude.toFixed(3)}`);
      const tableBytes = JSON.stringify(table).length;
      record("the star table is a fifth the size of the full file", tableBytes < 140000 && tableBytes < 657000 / 4, `${tableBytes.toLocaleString()} bytes versus 656,721`);

      document.getElementById("summary").textContent = (allPassed ? "PASS" : "FAIL") + " — sky map projection checks";
      document.title = "DONE " + (allPassed ? "PASS" : "FAIL");
    } catch (error) {
      record("harness error", false, error && error.stack || String(error));
      document.getElementById("summary").textContent = "FAIL — harness error";
      document.title = "DONE FAIL";
    }
  </script>
</body>
</html>
